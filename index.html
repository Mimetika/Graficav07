<style>
:root{
  --crema:#FDF8F3;--cremaHonda:#F5EBE0;--terracota:#B85C50;--terracotaHonda:#9E4A40;
  --salvia:#9BB08F;--madera:#8B6F47;--maderaClara:#A67B5B;--tinta:#2C2416;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--crema);color:var(--tinta);font-family:"DM Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
.cabecera{background:var(--terracota);color:var(--crema);padding:18px 30px 16px 30px;box-shadow:0 3px 10px rgba(44,36,22,0.18);}
.cabecera h1{margin:0;font-size:22px;font-weight:700;}
.cabecera p{margin:5px 0 0 0;font-size:12.5px;opacity:0.9;font-family:"JetBrains Mono",monospace;}
.marca{display:inline-block;font-size:11px;letter-spacing:3px;text-transform:uppercase;opacity:0.75;margin-bottom:4px;font-family:"JetBrains Mono",monospace;}
.solapas{display:flex;gap:4px;padding:0 30px;background:var(--cremaHonda);border-bottom:1px solid #E4D6C6;flex-wrap:wrap;}
.solapa{border:none;background:transparent;color:#8a7a68;font-family:"DM Sans",sans-serif;font-size:14px;font-weight:500;padding:14px 22px 12px 22px;cursor:pointer;border-bottom:3px solid transparent;}
.solapa:hover{color:var(--terracota);}
.solapa.viva{color:var(--terracotaHonda);font-weight:700;border-bottom-color:var(--salvia);}
.tablero{max-width:1220px;margin:22px auto;padding:0 22px 40px 22px;display:flex;gap:24px;align-items:flex-start;}
@media (max-width:1060px){.tablero{flex-direction:column;}}
.carta{background:#FFFDFB;border:1px solid #E7D9C9;border-radius:16px;padding:16px;box-shadow:0 6px 18px rgba(44,36,22,0.07);}
.zonaLienzo{flex:0 0 auto;}
.zonaLienzo canvas{display:block;border-radius:10px;cursor:crosshair;max-width:100%;height:auto;}
.panel{flex:1 1 auto;min-width:330px;}
.panel h2{margin:0 0 12px 0;font-size:17px;color:var(--terracotaHonda);}
.grupo{border:1px solid #EBDDCD;border-radius:12px;padding:12px 12px 6px 12px;margin-bottom:14px;background:var(--crema);}
.grupo > .rotulo{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--madera);margin-bottom:10px;}
.filaControl{display:flex;align-items:center;gap:10px;margin-bottom:10px;min-width:0;}
.filaControl label{font-size:13px;flex:0 0 120px;}
.filaControl input[type=number],.filaControl input[type=text],.filaControl select{flex:1 1 auto;min-width:0;font-family:"JetBrains Mono",monospace;font-size:13px;padding:6px 8px;border:1px solid #E0D0BF;border-radius:8px;background:#FFFDFB;color:var(--tinta);}
.filaControl input[type=color]{width:38px;height:30px;border:1px solid #E0D0BF;border-radius:8px;background:#FFFDFB;padding:2px;cursor:pointer;}
.filaControl input:focus,.filaControl select:focus{outline:none;border-color:var(--salvia);}
.filaControl input:disabled{opacity:0.45;}
.solapasCapa{display:flex;gap:6px;margin-bottom:12px;}
.chapa{flex:1;border:1px solid #E0D0BF;background:#FFFDFB;border-radius:9px;padding:8px 0;cursor:pointer;font-family:"JetBrains Mono",monospace;font-weight:700;font-size:13px;color:#8a7a68;}
.chapa .punto{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle;}
.chapa.viva{border-color:var(--tinta);color:var(--tinta);box-shadow:0 2px 6px rgba(44,36,22,0.12);}
.chapa.apagada{opacity:0.45;}
.tablaNodos{width:100%;border-collapse:collapse;margin:4px 0 10px 0;font-family:"JetBrains Mono",monospace;font-size:13px;}
.tablaNodos th{font-weight:500;color:#8a7a68;font-size:11px;text-align:left;padding:2px 4px;}
.tablaNodos td{padding:2px 3px;}
.tablaNodos input{width:62px;font-family:"JetBrains Mono",monospace;font-size:13px;padding:4px 6px;border:1px solid #E0D0BF;border-radius:6px;background:#FFFDFB;text-align:right;}
.tablaNodos input.textoNota{width:120px;text-align:left;font-family:"DM Sans",sans-serif;}
.tablaNodos .quita{border:none;background:transparent;color:var(--terracota);cursor:pointer;font-size:16px;padding:0 4px;}
.tablaNodos .ratio{color:var(--madera);font-size:12px;white-space:nowrap;}
.botonito{border:none;background:var(--cremaHonda);color:var(--tinta);font-family:"DM Sans",sans-serif;font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:8px;cursor:pointer;margin:0 6px 6px 0;}
.botonito:hover{background:#EADBC9;}
.mando{border:none;background:var(--madera);color:var(--crema);font-family:"DM Sans",sans-serif;font-size:13px;font-weight:700;padding:9px 16px;border-radius:10px;cursor:pointer;margin:0 8px 8px 0;box-shadow:0 2px 6px rgba(44,36,22,0.18);}
.mando:hover{background:var(--terracota);}
.mando:active{transform:translateY(1px);}
.desliza{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.desliza label{font-size:13px;flex:0 0 120px;}
.desliza input[type=range]{-webkit-appearance:none;flex:1;height:6px;border-radius:6px;background:linear-gradient(to right,var(--salvia),#C9D3C2);}
.desliza input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--terracota);border:3px solid #FFFDFB;cursor:pointer;}
.desliza input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--terracota);border:3px solid #FFFDFB;cursor:pointer;}
.desliza .cifra{font-family:"JetBrains Mono",monospace;font-size:13px;font-weight:700;color:var(--terracota);min-width:64px;text-align:right;}
.rejilla{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px;}
.rejilla > *{min-width:0;}
.rejilla .filaControl{min-width:0;}
.rejilla .filaControl label{flex:0 0 82px;}
.rejilla .filaControl input{min-width:0;}
.marcaTilde{display:flex;align-items:center;gap:8px;font-size:13px;margin:5px 0;}
.notaPie{font-size:12px;color:#7a6a58;line-height:1.5;margin:2px 0 0 0;}
input[type=checkbox]{accent-color:var(--terracota);width:16px;height:16px;}
.aviso{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--tinta);color:var(--crema);font-size:13px;padding:10px 18px;border-radius:10px;box-shadow:0 6px 18px rgba(44,36,22,0.3);z-index:50;}
.pie{text-align:center;font-family:"JetBrains Mono",monospace;font-size:11px;color:#a99883;padding:0 0 26px 0;letter-spacing:1px;}
</style>
</head>
